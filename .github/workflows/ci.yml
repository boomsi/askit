name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  test:
    runs-on: [self-hosted, askaway-linux]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: |
          # keel 是私有上游仓库，CI 默认 GITHUB_TOKEN 无权访问；askit 的 typecheck
          # 靠 keel-guest.d.ts stub 兜底、test 不 import keel，故移除 keel devDep 让 install 通过
          sed -i '/"keel":/d' package.json
          bun install

      - name: Run type check
        run: bun run typecheck

      - name: Run linter
        run: bun run lint

      - name: Run formatter check
        run: bun run format:check

      - name: Run tests
        run: bun test

      - name: Check source files
        run: |
          echo "Source files summary:"
          find src -type f \( -name "*.ts" -o -name "*.tsx" \) | wc -l
          echo "Test files:"
          find src -type f -name "*.test.ts" | wc -l
